function bet(betNum) {
  if(!running) return alert('Wait for next round');
  let amount = document.getElementById('bet'+betNum).value;
  if(amount <= 0) return alert('Enter amount');
  document.getElementById('btn'+betNum).innerText = 'CASH OUT ' + multiplier.toFixed(2) + 'x';
  document.getElementById('btn'+betNum).style.background = '#FF3D00';
}

function cashout(betNum) {
  if(!running) return;
  let amount = document.getElementById('bet'+betNum).value;
  let win = (amount * multiplier).toFixed(2);
  alert('Cashed out! Won ' + win + ' GHS at ' + multiplier.toFixed(2) + 'x');
  document.getElementById('btn'+betNum).innerText = 'Bet';
  document.getElementById('btn'+betNum).style.background = '#2979FF';
}

  let players = document.getElementById('players');

  if(players.children.length > 10) players.removeChild(players.lastChild);
}
