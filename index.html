<script>
let coins=963; 
let playing=false; 
let multi=1.00; 
let betAmount=100;
let interval;
let betPlaced=false;

function bet(){ 
  if(!playing && coins >= betAmount){
    playing=true; 
    betPlaced=true;
    coins-=betAmount; 
    updateCoins(); 
    document.querySelector('.betbtn').innerText="WAITING...";
    document.querySelector('.betbtn').style.background="#555";
    startGame();
  }
}

function cashout(){ 
  if(playing && betPlaced){
    playing=false; 
    betPlaced=false;
    let win = betAmount * multi;
    coins+=win; 
    updateCoins();
    addToHistory(multi);
    resetButtons();
  }
}

function updateCoins(){
  document.getElementById('coins').innerText=coins;
}

function startGame(){
  multi=1.00;
  let plane = document.getElementById('plane');
  let x=20, y=200;
  interval=setInterval(()=>{
    if(!playing){
      clearInterval(interval);
      if(betPlaced){ // crashed
        addToHistory(multi);
        resetButtons();
        betPlaced=false;
      }
      return;
    } 
    multi+=0.02; 
    document.getElementById('multi').innerText=multi.toFixed(2)+'x'; 
    document.getElementById('cashoutVal').innerText=(betAmount*multi).toFixed(2);
    
    // MOVE PLANE UP AND RIGHT
    x += 2;
    y -= 1.5;
    plane.style.left = x + 'px';
    plane.style.bottom = y + 'px';
    
    // CRASH RANDOMLY BETWEEN 1.01x - 50x
    if(multi > 1.01 && Math.random() < 0.01){
      playing=false;
    }
    if(multi > 50){playing=false;}
  },50);
}

function resetButtons(){
  document.querySelector('.betbtn').innerText="Bet\n1.00";
  document.querySelector('.betbtn').style.background="#00C853";
}

function addToHistory(m){
  let h = document.getElementById('history');
  let color = m < 2 ? 'g1' : m < 10 ? 'g2' : 'g3';
  h.innerHTML = `<div class="hist ${color}">${m.toFixed(2)}x</div>` + h.innerHTML;
}
</script>
