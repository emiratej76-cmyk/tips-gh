<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviator - FLY GH</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5870062832035254"
     crossorigin="anonymous"></script>
<style>
*{margin:0; padding:0; box-sizing:border-box; font-family:Arial;}
body{background:#0F1116; color:white;}
.header{background:#1A1D23; padding:10px; display:flex; justify-content:space-between; align-items:center;}
.logo{color:#FF3B30; font-size:20px; font-weight:bold;}
.balance{font-weight:bold;}
.history{display:flex; gap:8px; padding:10px; overflow-x:auto; background:#1A1D23;}
.hist{padding:4px 10px; border-radius:20px; font-size:12px; font-weight:bold;}
.g1{background:#00C853;} .g2{background:#2979FF;} .g3{background:#D500F9;}
.game{background:linear-gradient(180deg,#1a0000 0%, #0F1116 100%); height:280px; position:relative; overflow:hidden; border-radius:12px; margin:10px;}
#curve{position:absolute; bottom:0; left:0; width:100%; height:100%;}
.plane{position:absolute; font-size:28px; transition: all 0.05s linear; z-index:2;}
.multi{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:60px; font-weight:bold; color:white; z-index:2;}
.betbox{background:#1A1D23; margin:10px; padding:10px; border-radius:12px;}
.betrow{display:flex; gap:10px;}
.amount{flex:1; background:#2A2E38; padding:15px; border-radius:8px; text-align:center; font-size:18px; font-weight:bold;}
.bigbtn{flex:2; padding:20px; border:none; border-radius:8px; font-size:20px; font-weight:bold;}
.betbtn{background:#00C853; color:white;}
.cashbtn{background:#FF9500; color:white;}
.adspace{background:#222; margin:10px; padding:20px; text-align:center; border:2px dashed gray; color:gray;}
</style>
</head>
<body>
<div class="header">
  <div class="logo">Aviator</div>
  <div class="balance"><span id="coins">1000</span> COINS</div>
</div>

<div class="history" id="history">
  <div class="hist g2">6.04x</div><div class="hist g2">2.05x</div><div class="hist g1">1.48x</div>
</div>

<div class="game">
  <svg id="curve"></svg>
  <div class="plane" id="plane">✈️</div>
  <div class="multi" id="multi">1.00x</div>
</div>

<div class="betbox">
  <div class="betrow">
    <div class="amount">0.10<br><span style="font-size:12px;">COINS</span></div>
    <button class="bigbtn cashbtn" id="cashBtn" onclick="cashout()">Cash Out<br><span id="cashoutVal">0.10</span></button>
  </div>
</div>

<div class="betbox">
  <div class="betrow">
    <div class="amount">1.00<br><span style="font-size:12px;">COINS</span></div>
    <button class="bigbtn betbtn" id="betBtn" onclick="bet()">Bet<br><span>1.00</span></button>
  </div>
</div>

<div class="adspace">AD BANNER SPACE</div>

<script>
let coins=1000; 
let playing=false; 
let multi=1.00; 
let betAmount=100;
let interval;
let betPlaced=false;
let points=[];

function bet(){ 
  if(!playing && coins >= betAmount){
    playing=true; 
    betPlaced=true;
    points=[];
    coins-=betAmount; 
    updateCoins(); 
    document.getElementById('betBtn').innerText="WAITING...";
    document.getElementById('betBtn').style.background="#555";
    document.getElementById('cashBtn').style.background="#FF9500";
    startGame();
  }
}

function cashout(){ 
  if(playing && betPlaced){
    playing=false; 
    betPlaced=false;
    let win = betAmount * multi;
    coins+=win; 
    updateCoins();
    addToHistory(multi);
    resetButtons();
  }
}

function updateCoins(){
  document.getElementById('coins').innerText=Math.floor(coins);
}

function startGame(){
  multi=1.00;
  let plane = document.getElementById('plane');
  let svg = document.getElementById('curve');
  let crashPoint = 1.01 + Math.random() * 20; // Random crash between 1.01x - 21x
  
  interval=setInterval(()=>{
    if(!playing){
      clearInterval(interval);
      if(betPlaced){ 
        addToHistory(multi);
        resetButtons();
        betPlaced=false;
      }
      return;
    } 
    
    multi+=0.025; 
    document.getElementById('multi').innerText=multi.toFixed(2)+'x'; 
    document.getElementById('cashoutVal').innerText=(betAmount*multi).toFixed(2);
    
    // CALCULATE CURVE POSITION
    let x = (multi - 1) * 20; // moves right
    let y = (multi - 1) * 15; // moves up
    points.push(`${x},${280-y}`);
    
    // DRAW CURVE
    svg.innerHTML = `<polyline points="0,280 ${points.join(' ')}" fill="none" stroke="#FF3B30" stroke-width="3"/>`;
    
    // MOVE PLANE
    plane.style.left = (x + 10) + 'px';
    plane.style.bottom = (y + 10) + 'px';
    
    // CRASH
    if(multi >= crashPoint){
      playing=false;
      plane.style.filter="grayscale(100%)";
      setTimeout(()=>{plane.style.filter="";},1000);
    }
    if(multi > 50){playing=false;}
  },50);
}

function resetButtons(){
  document.getElementById('betBtn').innerHTML="Bet<br><span>1.00</span>";
  document.getElementById('betBtn').style.background="#00C853";
}

function addToHistory(m){
  let h = document.getElementById('history');
  let color = m < 2 ? 'g1' : m < 10 ? 'g2' : 'g3';
  h.innerHTML = `<div class="hist ${color}">${m.toFixed(2)}x</div>` + h.innerHTML;
}
</script>
</body>
</html>
