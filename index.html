<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLY GH - Aviator Game</title>
<style>
body{background:#0D0D0D; color:white; font-family:Arial; margin:0; text-align:center;}
.header{background:#FF4500; padding:12px; font-size:20px; font-weight:bold;}
#game{height:300px; background:#000; position:relative; overflow:hidden; margin:10px; border-radius:8px;}
#plane{position:absolute; bottom:20px; left:20px; font-size:35px; transition: all 0.1s linear;}
#multiplier{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:55px; font-weight:bold; color:#00FF00;}
.btn{width:95%; padding:16px; margin:8px auto; border:none; border-radius:8px; font-size:18px; font-weight:bold; display:block;}
.bet{background:#FF4500; color:white;}
.cashout{background:#00C853; color:black; display:none;}
.adbtn{background:gold; color:black;}
.coins{font-size:18px; padding:10px; font-weight:bold;}
</style>
</head>
<body>

<div class="header">FLY GH ✈️</div>
<div class="coins">💰 COINS: <span id="coins">1000</span></div>

<div id="game">
  <div id="plane">✈️</div>
  <div id="multiplier">1.00x</div>
</div>

<button class="btn bet" id="betBtn" onclick="startGame()">BET 100 COINS</button>
<button class="btn cashout" id="cashoutBtn" onclick="cashOut()">CASH OUT 100.00</button>
<button class="btn adbtn" onclick="getCoins()">WATCH AD FOR +500 COINS</button>

<p style="font-size:12px; color:gray;">For fun only. No real money.</p>

<script>
let coins = 1000;
let multiplier = 1.00;
let playing = false;
let betAmount = 100;
let interval;

function startGame(){
  if(coins < betAmount || playing) return;
  coins -= betAmount;
  updateCoins();
  playing = true;
  multiplier = 1.00;
  
  document.getElementById('betBtn').style.display = 'none';
  document.getElementById('cashoutBtn').style.display = 'block';
  
  interval = setInterval(()=>{
    multiplier += 0.04 + Math.random()*0.02; // random speed
    document.getElementById('multiplier').innerText = multiplier.toFixed(2) + 'x';
    document.getElementById('cashoutBtn').innerText = `CASH OUT ${(betAmount * multiplier).toFixed(0)}`;
    document.getElementById('plane').style.bottom = (20 + multiplier*15) + 'px';
    document.getElementById('plane').style.left = (20 + multiplier*15) + 'px';
    
    // Random crash between 1.00x and 50x
    if(Math.random() < 0.015){
      crash();
    }
  },100);
}

function cashOut(){
  if(!playing) return;
  clearInterval(interval);
  let win = betAmount * multiplier;
  coins += win;
  updateCoins();
  alert('✅ You cashed out at ' + multiplier.toFixed(2) + 'x! Won ' + win.toFixed(0) + ' coins');
  reset();
}

function crash(){
  clearInterval(interval);
  alert('💥 CRASHED at ' + multiplier.toFixed(2) + 'x! You lost.');
  reset();
}

function reset(){
  playing = false;
  document.getElementById('betBtn').style.display = 'block';
  document.getElementById('cashoutBtn').style.display = 'none';
  document.getElementById('multiplier').innerText = '1.00x';
  document.getElementById('plane').style.bottom = '20px';
  document.getElementById('plane').style.left = '20px';
}

function updateCoins(){
  document.getElementById('coins').innerText = coins.toFixed(0);
}

function getCoins(){
  alert('Watch ad here - coming soon');
  coins += 500;
  updateCoins();
}

</script>
</body>
</html>
