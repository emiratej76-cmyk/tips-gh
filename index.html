<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLY GH - Aviator Game</title>
<style>
body{background:#0D0D0D; color:white; font-family:Arial; margin:0; text-align:center;}
.header{background:#FF0000; padding:12px; font-size:20px; font-weight:bold;}
#game{height:300px; background:#111; position:relative; overflow:hidden; margin:10px;}
#plane{position:absolute; bottom:20px; left:20px; font-size:30px; transition: all 0.1s linear;}
#multiplier{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:50px; font-weight:bold; color:#00C853;}
.btn{width:90%; padding:15px; margin:8px; border:none; border-radius:8px; font-size:18px; font-weight:bold;}
.bet{background:#FF0000; color:white;}
.cashout{background:#00C853; color:black; display:none;}
.coins{font-size:18px; padding:10px;}
</style>
</head>
<body>

<div class="header">FLY GH ✈️</div>
<div class="coins">💰 COINS: <span id="coins">1000</span></div>

<div id="game">
  <div id="plane">✈️</div>
  <div id="multiplier">1.00x</div>
</div>

<button class="btn bet" onclick="startGame()">BET 100 COINS</button>
<button class="btn cashout" id="cashoutBtn" onclick="cashOut()">CASH OUT</button>
<button class="btn" style="background:gold; color:black;" onclick="getCoins()">WATCH AD FOR +500 COINS</button>

<p style="font-size:12px; color:gray;">For fun only. No real money.</p>

<script>
let coins = 1000;
let multiplier = 1.00;
let playing = false;
let interval;

function startGame(){
  if(coins < 100 || playing) return;
  coins -= 100;
  updateCoins();
  playing = true;
  multiplier = 1.00;
  document.querySelector('.bet').style.display = 'none';
  document.getElementById('cashoutBtn').style.display = 'block';
  
  interval = setInterval(()=>{
    multiplier += 0.05;
    document.getElementById('multiplier').innerText = multiplier.toFixed(2) + 'x';
    document.getElementById('plane').style.bottom = (20 + multiplier*20) + 'px';
    document.getElementById('plane').style.left = (20 + multiplier*20) + 'px';
    
    // Random crash
    if(Math.random() < 0.02){
      crash();
    }
  },100);
}

function cashOut(){
  if(!playing) return;
  let win = 100 * multiplier;
  coins += win;
  updateCoins();
  alert('You cashed out at ' + multiplier.toFixed(2) + 'x! Won ' + win.toFixed(0) + ' coins');
  reset();
}

function crash(){
  clearInterval(interval);
  alert('CRASHED at ' + multiplier.toFixed(2) + 'x! You lost.');
  reset();
}

function reset(){
  playing = false;
  document.querySelector('.bet').style.display = 'block';
  document.getElementById('cashoutBtn').style.display = 'none';
  document.getElementById('multiplier').innerText = '1.00x';
  document.getElementById('plane').style.bottom = '20px';
  document.getElementById('plane').style.left = '20px';
}

function updateCoins(){
  document.getElementById('coins').innerText = coins.toFixed(0);
}

function getCoins(){
  alert('Watch ad here'); // Later we add Google Ad
  coins += 500;
  updateCoins();
}

</script>
</body>
</html>
