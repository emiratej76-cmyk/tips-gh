<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviator Pro</title>
<style>
  body { background:#0F1218; color:white; font-family: Arial; margin:0; padding:0; }
 .header { background:#1A1D23; padding:12px; text-align:center; font-size:20px; font-weight:bold; color:#FF3D00; }
 .game-area { background:#12151C; height:300px; display:flex; align-items:center; justify-content:center; font-size:40px; border-bottom:2px solid #2A2E38; }
 .multi { color:#00C853; }
 .panels { display:flex; gap:10px; padding:10px; }
 .bet-box { flex:1; background:#1A1D23; padding:10px; border-radius:12px; }
 .bet-box input { width:90%; padding:8px; background:#2A2E38; border:none; color:white; border-radius:6px; margin:5px 0; }
 .btn { width:100%; padding:12px; border:none; border-radius:8px; font-weight:bold; font-size:16px; }
 .btn-bet { background:#2979FF; color:white; }
 .btn-cash { background:#00C853; color:white; }
 .history { display:flex; gap:5px; padding:10px; overflow-x:auto; }
 .history span { background:#2A2E38; padding:4px 8px; border-radius:6px; font-size:12px; }
 .players { background:#1A1D23; margin:10px; padding:10px; border-radius:12px; }
</style>
</head>
<body>

<div class="header">AVIATOR PRO</div>

<div class="game-area">
  <div>✈️ <span class="multi" id="multi">1.00x</span></div>
</div>

<div class="history" id="history"></div>

<div class="panels">
  <div class="bet-box">
    <h4>Bet 1</h4>
    <input type="number" value="10.00" id="bet1">
    <button class="btn btn-bet" onclick="bet(1)">Bet</button>
    <button class="btn btn-cash" onclick="cashout(1)">Cash Out</button>
  </div>
  <div class="bet-box">
    <h4>Bet 2</h4>
    <input type="number" value="10.00" id="bet2">
    <button class="btn btn-bet" onclick="bet(2)">Bet</button>
    <button class="btn btn-cash" onclick="cashout(2)">Cash Out</button>
  </div>
</div>

<div class="players">
  <div style="display:flex; gap:10px; margin-bottom:10px;">
    <div style="flex:1; text-align:center; background:#3A3E48; padding:8px; border-radius:8px; font-weight:bold;">All Bets</div>
  </div>
  <div id="players" style="font-size:12px; max-height:220px; overflow-y:auto;"></div>
</div>

<script>
let currentMulti = 1.00;
let crashPoint = 2.5;
let gameRunning = false;
let bets = {1:0, 2:0};

function startRound(){
  currentMulti = 1.00;
  crashPoint = (Math.random()*10 + 1.1).toFixed(2); // random crash
  gameRunning = true;
  let interval = setInterval(()=>{
    currentMulti += 0.02;
    document.getElementById('multi').innerText = currentMulti.toFixed(2)+'x';
    if(currentMulti >= crashPoint){
      clearInterval(interval);
      gameRunning = false;
      addHistory(crashPoint);
      setTimeout(startRound, 3000);
    }
  }, 50);
}

function bet(id){
  bets[id] = document.getElementById('bet'+id).value;
  alert('Bet '+id+' placed: '+bets[id]+' GHS');
}

function cashout(id){
  if(bets[id] > 0 && gameRunning){
    let win = (bets[id] * currentMulti).toFixed(2);
    alert('Cashed Out Bet '+id+': '+win+' GHS');
    bets[id] = 0;
  }
}

function addHistory(multi){
  let span = document.createElement('span');
  span.style.color = multi > 2? '#00C853' : '#FF3D00';
  span.innerText = multi+'x';
  document.getElementById('history').prepend(span);
}

// FAKE PLAYERS
let names = ["Kofi_23", "Ama_Wins", "Yaw_777", "QueenB", "ProPlayer", "BossMan"];
function addPlayer(){
  let name = names[Math.floor(Math.random()*names.length)];
  let bet = (Math.random()*200+10).toFixed(2);
  let multi = (Math.random()*15+1.01).toFixed(2);
  let cashout = (bet*multi).toFixed(2);
  let div = document.createElement('div');
  div.style = "display:flex; justify-content:space-between; padding:6px 4px; border-bottom:1px solid #2A2E38;";
  div.innerHTML = `<span>${name}</span><span>${bet}</span><span style="color:#2979FF;">${multi}x</span><span style="color:#00C853;">${cashout}</span>`;
  let players = document.getElementById('players');
  players.prepend(div);
  if(players.children.length > 15) players.removeChild(players.lastChild);
}
setInterval(addPlayer, 1500);
for(let i=0; i<8; i++) addPlayer();

startRound();
</script>

  <p>18+ Only. Play Responsibly. DEMO MODE</p>
</div>
<!-- FOOTER ENDS HERE -->

</body>
</html>
